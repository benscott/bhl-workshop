; Workshop box tuning. Mounted read-write because the image's entrypoint also
; writes docker.ini into this directory.

[ken]
; "ken" is CouchDB 3.x's background indexer. Its default concurrency (20) let it
; start 12 view-index jobs at once while bhl-lite was replicating in, which
; pushed the container to 7.4 GB on a 7.6 GB box and got it OOM-killed eight
; times in a row. One job at a time is survivable; see ken.ignore below for why
; that alone was not enough.
limit = 1

[ken.ignore]
; bhl-lite has 7 design documents, so every batch of replicated documents
; triggered a re-index across ~12 shard/view jobs. That burned the full 4 GB
; container limit continuously and starved replication down to 20 docs per 12
; minutes. Skipping background indexing while the database fills lets the data
; land first; indexing then happens once, on a complete dataset.
;
; REMOVE THIS LINE once replication has caught up, and restart CouchDB, so the
; views actually build -- bhl-light needs them.
bhl-lite = true

[couchdb]
; Cap databases held open at once; the default (500) reserves more per-db state
; than this box can spare alongside the CLIP search API.
max_dbs_open = 100
