; Workshop box tuning. This file is mounted into the container, so it survives
; a recreate -- settings applied through the _config HTTP API do not.

[ken]
; "ken" is CouchDB 3.x's background indexer. Its default concurrency (20) let it
; start 12 view-index jobs at once while bhl-lite was replicating in, which
; pushed the container to 7.4 GB on a 7.6 GB box and got it OOM-killed eight
; times in a row. Serialising index builds keeps it inside the memory the box
; actually has, at the cost of slower first-time view builds.
limit = 1

[couchdb]
; Cap the number of databases held open at once; the default (500) reserves
; more per-db state than this box can spare alongside the CLIP search API.
max_dbs_open = 100
