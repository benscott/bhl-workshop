# Brings up the whole workshop stack: one Apache+PHP container serving all five
# sites as subdirectories, plus CouchDB. Run on the Hetzner box.
#
#   docker compose up -d
#
# Sites are served at:
#   http://HOST/bhl-light/            (expects web_root '/bhl-light/')
#   http://HOST/bhl-name-timeline/
#   http://HOST/bhl-all-the-pages/
#   http://HOST/bhl-image-search/
#   http://HOST/bhl-mcp/                 (MCP server, not a browser UI)
#
# Put a real TLS reverse proxy (Caddy/Traefik) in front for the workshop URL.

services:
  web:
    # Built from ./Dockerfile so gd (with webp) and pdo_sqlite are compiled in.
    build: .
    restart: unless-stopped
    expose:
      - "80"
    env_file: .env
    volumes:
      - ./sites:/var/www/html
    depends_on:
      - couchdb

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the DIRECTORY, not the file. A single-file bind mount pins the
      # inode, so `git pull` replacing Caddyfile leaves the container serving
      # the old copy while the host shows the new one.
      - ./caddy:/etc/caddy:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      - web

  couchdb:
    image: couchdb:3.4
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USERNAME}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    # Deliberately NOT published to the host, so CouchDB is not on the public
    # internet at all. It is reachable on the internal Docker network (the PHP
    # container) and through Caddy at https://<host>/_couch/ for replication
    # from the Mini, which therefore travels over 443.
    expose:
      - "5984"
    # Hard ceiling so CouchDB can never again exhaust the host and put the
    # uvicorn search API at risk: if it exceeds this, only CouchDB is killed.
    mem_limit: 4g
    volumes:
      - ./couch-data:/opt/couchdb/data
      # local.d, mounted READ-WRITE. Three things forced this shape:
      #   - mounting a directory over default.d hides the image's own
      #     10-docker-default.ini and CouchDB then exits 1 with no log output
      #   - mounting a single file INTO default.d also kills it silently
      #   - local.d cannot be read-only: the entrypoint writes docker.ini there
      #     to inject COUCHDB_USER/PASSWORD
      # Consequence: docker.ini lands here containing the admin password, so it
      # is gitignored.
      - ./couchdb/local.d:/opt/couchdb/etc/local.d
