# Brings up the whole workshop stack: one Apache+PHP container serving all four
# sites as subdirectories, plus CouchDB. Run on the Hetzner box.
#
#   docker compose up -d
#
# Sites are served at:
#   http://HOST/bhl-light/            (expects web_root '/bhl-light/')
#   http://HOST/bhl-name-timeline/
#   http://HOST/bhl-all-the-pages/
#   http://HOST/bhl-image-search/
#
# Put a real TLS reverse proxy (Caddy/Traefik) in front for the workshop URL.

services:
  web:
    # Built from ./Dockerfile so gd (with webp) and pdo_sqlite are compiled in.
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
    env_file: .env
    volumes:
      - ./sites:/var/www/html
      # bhl-name-timeline's config.inc.php hardcodes the Mac path to its SQLite
      # database. Rather than patch the site repo, mount the synced copy at
      # exactly that path inside the container. Read-write, because SQLite needs
      # to create its -wal/-shm sidecars beside the file.
      - ./sites/bhl-name-timeline:/Users/rpage/Sites/bhl-data-new-ideas-o
    depends_on:
      - couchdb

  couchdb:
    image: couchdb:3.4
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USERNAME}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    ports:
      # Exposed so the Mini can push replication to this box. Lock this down to
      # the Mini's IP in the firewall, or better: only expose via the TLS proxy.
      - "5984:5984"
    volumes:
      - ./couch-data:/opt/couchdb/data
